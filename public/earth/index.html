<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Summon</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            background:
                radial-gradient(circle at 28% 34%, rgba(146, 228, 166, 0.05), transparent 16%),
                radial-gradient(circle at 72% 60%, rgba(84, 160, 112, 0.03), transparent 18%),
                linear-gradient(180deg, #1c241d 0%, #222c23 12%, #29362b 50%, #1d271e 88%, #161d17 100%);
            color: #eef5eb;
        }
        #left-col {
            position: relative;
            width: 100%;
            height: 100vh;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body.settled #left-col { width: 42%; }
        #scene-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        #character {
            position: absolute;
            bottom: -100%;
            left: 50%;
            height: 88vh;
            width: auto;
            transform: translateX(-50%);
            transition: bottom 1.5s cubic-bezier(0.25, 1, 0.5, 1), left 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
            user-select: none;
            -webkit-user-drag: none;
        }
        body.boot #character { bottom: 0; }
        body.settled #character { left: 52%; transform: translateX(-50%); }
        #magic-container {
            position: absolute;
            left: 50%;
            bottom: 25%;
            width: min(24vw, 180px);
            aspect-ratio: 1 / 1;
            transform: translateX(-50%) scale(0.82);
            transform-origin: center;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            overflow: visible;
            transition: opacity 0.9s ease, transform 1.1s ease, left 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            filter: drop-shadow(0 0 18px rgba(210, 182, 102, 0.30)) drop-shadow(0 0 42px rgba(121, 92, 38, 0.22));
        }
        body.orb-on #magic-container { opacity: 1; transform: translateX(-50%) scale(1); }
        body.orb-on:not(.settled) #magic-container { left: 52.4%; bottom: 25.4%; }
        body.settled #magic-container { left: 58%; }
        #orb-canvas {
            position: absolute;
            inset: -32%;
            width: 164%;
            height: 164%;
            display: block;
        }
        #right-col {
            width: 58%;
            min-width: 0;
            height: 100vh;
            padding: 38px 34px 140px 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            opacity: 0;
            transform: translateX(48px);
            transition: opacity 0.85s ease, transform 0.95s ease;
            border-left: 1px solid rgba(123, 205, 143, 0.24);
            background: linear-gradient(180deg, rgba(26, 48, 32, 0.34), rgba(12, 22, 15, 0.16));
            overflow-y: auto;
        }
        body.settled #right-col { opacity: 1; transform: translateX(0); }
        #right-col::-webkit-scrollbar { width: 6px; }
        #right-col::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        #right-col::-webkit-scrollbar-thumb { background: rgba(123, 205, 143, 0.3); border-radius: 10px; }
        #right-col::-webkit-scrollbar-thumb:hover { background: rgba(123, 205, 143, 0.5); }
        
        .ev-marker { font-size: clamp(8px, 1vw, 10px); letter-spacing: 5px; color: #d5f3da; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.32); text-transform: uppercase; margin-bottom: 8px; text-align: center; }
        .ev-title { font-size: clamp(22px, 3.5vw, 38px); font-weight: 800; line-height: 1.1; margin-bottom: 10px; color: #f4fff5; text-shadow: 0 6px 20px rgba(0, 0, 0, 0.22); text-align: center; }
        .ev-div { width: 36px; height: 1px; background: linear-gradient(90deg, transparent, #80d89b, transparent); margin: 0 auto 18px; }
        .ev-copy { max-width: 560px; color: rgba(239, 250, 241, 0.9); line-height: 1.62; margin: 0 auto 22px; text-align: center; }
        
        .clubs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
            gap: 28px 20px;
            max-width: 760px;
            margin: 0 auto 72px;
            justify-content: center;
        }
        
        .club-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            padding: 0;
            overflow: visible;
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .club-card:hover { transform: translateY(-4px); }
        .club-logo {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 35% 30%, rgba(161, 240, 178, 0.16), rgba(18, 31, 22, 0.88));
            border: 1px solid rgba(123, 205, 143, 0.24);
            border-radius: 999px;
            padding: 14px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.34);
            cursor: pointer;
            transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
        }
        .club-card:hover .club-logo,
        .club-card.active .club-logo {
            transform: scale(1.06);
            border-color: rgba(146, 228, 166, 0.44);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.42), 0 0 18px rgba(123, 205, 143, 0.16);
        }
        .club-logo img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5)); }
        .club-info { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .club-type { display: none; }
        .club-name { color: #f4fff5; font-size: 14px; font-weight: 700; line-height: 1.35; max-width: 140px; }
        .club-events-pop {
            position: absolute;
            top: 14px;
            left: 50%;
            width: 180px;
            padding: 16px 14px;
            background: rgba(10, 18, 12, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translate(-50%, 8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(123, 205, 143, 0.2);
            border-radius: 18px;
            box-shadow: 0 20px 36px rgba(0, 0, 0, 0.44);
            pointer-events: none;
            z-index: 5;
        }
        .club-card:hover .club-events-pop,
        .club-card.active .club-events-pop { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
        .pop-title { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #8edaa4; margin-bottom: 4px; }
        .ev-item {
            font-size: 13px; font-weight: 600; color: #f4fff6; background: rgba(123, 205, 143, 0.14);
            padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(123, 205, 143, 0.2);
            width: 100%; transition: all 0.3s ease;
        }
        .ev-item:hover { background: rgba(123, 205, 143, 0.24); transform: scale(1.05); }

        #ev-modal {
            position: fixed; inset: 0; z-index: 1000; background: rgba(10, 7, 3, 0.85);
            backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease; padding: 20px;
        }
        #ev-modal.open { opacity: 1; pointer-events: auto; }
        .modal-content {
            width: 100%; max-width: 500px; background: linear-gradient(135deg, #1c140b 0%, #0f0b06 100%);
            border: 1px solid rgba(194, 161, 74, 0.3); border-radius: 24px; padding: 40px 32px;
            position: relative; transform: scale(0.9) translateY(20px); transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(194, 161, 74, 0.1);
        }
        #ev-modal.open .modal-content { transform: scale(1) translateY(0); }
        .modal-close { position: absolute; top: 24px; right: 24px; width: 32px; height: 32px; cursor: pointer; color: rgba(224, 198, 128, 0.6); transition: color 0.3s ease; }
        .modal-close:hover { color: #e2c56a; }
        .modal-marker { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: rgba(224, 198, 128, 0.5); margin-bottom: 8px; }
        .modal-title { font-size: 28px; font-weight: 800; color: #f5ead7; margin-bottom: 24px; line-height: 1.2; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
        .modal-field label { display: block; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(224, 198, 128, 0.5); margin-bottom: 6px; }
        .modal-field div { font-size: 14px; font-weight: 600; color: #fff; }
        .reg-btn {
            display: block; width: 100%; padding: 16px; background: linear-gradient(180deg, #e2c56a 0%, #c2a14a 100%);
            color: #1c140b; text-align: center; text-decoration: none; font-weight: 800; border-radius: 12px;
            font-size: 14px; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .reg-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(194, 161, 74, 0.3); }

        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; }
            #left-col, body.settled #left-col, #right-col { width: 100%; }
            #left-col { min-height: 62vh; }
            #right-col { min-height: 38vh; padding: 24px 20px 28px; transform: translateY(28px); border-left: 0; border-top: 1px solid rgba(194, 161, 74, 0.18); }
            body.settled #right-col { transform: translateY(0); }
            body.settled #character { left: 50%; }
            body.settled #magic-container { left: 52%; }
            .clubs-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; }
        }
        @media (max-width: 420px) {
            .clubs-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px; }
            .club-logo { width: 82px; height: 82px; padding: 12px; }
            .club-name { font-size: 13px; max-width: 120px; }
            .club-events-pop { width: 164px; }
        }
    </style>
</head>
<body>
    <div id="left-col">
        <div id="scene-container">
            <img id="character" src="/earth/character.webp" alt="Earth Character">
            <div id="magic-container"><canvas id="orb-canvas"></canvas></div>
        </div>
    </div>
    <div id="right-col">
        <div style="margin: auto 0; width: 100%;">
            <div class="ev-marker">South - Prithvi District</div>
            <h1 class="ev-title">CLUB EVENTS</h1>
            <div class="ev-div"></div>
            <p class="ev-copy">The Prithvi district gathers the clubs that give the fest its weight and character. Each circle anchors a different discipline, from code and robotics to culture, design, media, and community work.</p>
            <div class="clubs-grid" id="clubs-grid"></div>
        </div>
    </div>

    <div id="ev-modal">
        <div class="modal-content">
            <div class="modal-close" id="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" /></svg></div>
            <div class="modal-marker">Event Detail</div>
            <h2 class="modal-title" id="m-title">Event Name</h2>
            <div class="modal-grid">
                <div class="modal-field"><label>Date / Time</label><div id="m-date">-</div></div>
                <div class="modal-field"><label>Location</label><div id="m-loc">-</div></div>
                <div class="modal-field"><label>Prize Pool</label><div id="m-prize">-</div></div>
                <div class="modal-field"><label>Contact</label><div id="m-contact">-</div></div>
            </div>
            <div class="modal-field" style="margin-bottom: 24px;"><label>Description</label><div id="m-desc">-</div></div>
            <a href="#" class="reg-btn" id="m-link" target="_blank">Register Now</a>
        </div>
    </div>

    <script>
        const character = document.getElementById('character');
        const canvas = document.getElementById('orb-canvas');
        const ctx = canvas.getContext('2d');
        let cx = 0, cy = 0, radius = 0, startTime = performance.now(), igniteAt = 0, loopStarted = false;
        const isLowPower = navigator.hardwareConcurrency <= 4 || /Android|iPhone|iPad/i.test(navigator.userAgent);
        const ringCount = isLowPower ? 3 : 4, shardCount = isLowPower ? 8 : 12, moteCount = isLowPower ? 26 : 40;

        const motes = Array.from({ length: moteCount }, () => ({
            angle: Math.random() * Math.PI * 2,
            distance: 0.38 + Math.random() * 0.56,
            size: 1.4 + Math.random() * 3.4,
            speed: 0.18 + Math.random() * 0.5,
            orbit: (Math.random() < 0.5 ? -1 : 1) * (0.14 + Math.random() * 0.32),
            alpha: 0.28 + Math.random() * 0.42,
            rise: 0.04 + Math.random() * 0.16
        }));

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, isLowPower ? 1 : 1.5);
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr);
            cx = rect.width / 2; cy = rect.height / 2;
            radius = Math.min(rect.width, rect.height) * 0.23;
        }

        function polarPoint(angle, dist, yScale = 1) { return { x: cx + Math.cos(angle) * dist, y: cy + Math.sin(angle) * dist * yScale }; }

        function drawEarthGlow(energy) {
            const outer = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2.55);
            outer.addColorStop(0, `rgba(242, 224, 177, ${0.10 * energy})`);
            outer.addColorStop(0.24, `rgba(195, 161, 94, ${0.14 * energy})`);
            outer.addColorStop(0.55, `rgba(120, 88, 36, ${0.12 * energy})`);
            outer.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = outer; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawCore(energy, t) {
            const coreR = radius * (0.79 + Math.sin(t * 1.8) * 0.03);
            const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.6);
            aura.addColorStop(0, `rgba(250, 241, 214, ${0.9 * energy})`);
            aura.addColorStop(0.5, `rgba(143, 109, 56, ${0.42 * energy})`);
            aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(cx, cy, radius * 1.6, 0, Math.PI * 2); ctx.fill();
            const core = ctx.createRadialGradient(cx - radius * 0.08, cy - radius * 0.12, radius * 0.05, cx, cy, coreR);
            core.addColorStop(0, `rgba(255, 248, 232, ${0.96 * energy})`);
            core.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = core; ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI * 2); ctx.fill();
        }

        function drawStoneRings(energy, t) {
            for (let i = 0; i < ringCount; i++) {
                const phase = t * (0.8 + i * 0.12) + i * 1.4;
                const r = radius * (0.94 + i * 0.16 + Math.sin(phase) * 0.02);
                ctx.strokeStyle = `rgba(216, 188, 122, ${(0.14 - i * 0.02) * energy})`;
                ctx.lineWidth = Math.max(1, radius * (0.022 - i * 0.003));
                ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.86, phase * 0.08, 0, Math.PI * 2); ctx.stroke();
            }
        }

        function drawShards(energy, t) {
            for (let i = 0; i < shardCount; i++) {
                const baseAngle = (i / shardCount) * Math.PI * 2 + t * (0.16 + (i % 3) * 0.05);
                const inner = polarPoint(baseAngle, radius * 0.4), outer = polarPoint(baseAngle + 0.08, radius * 1.02);
                ctx.strokeStyle = `rgba(198, 163, 94, ${0.46 * energy})`; ctx.lineWidth = radius * 0.024;
                ctx.beginPath(); ctx.moveTo(inner.x, inner.y); ctx.lineTo(outer.x, outer.y); ctx.stroke();
            }
        }

        function drawMotes(energy, t) {
            for (const mote of motes) {
                const ang = mote.angle + t * mote.orbit, dist = radius * (1.02 + mote.distance);
                const x = cx + Math.cos(ang) * dist, y = cy + Math.sin(ang) * dist * 0.84;
                ctx.fillStyle = `rgba(248, 235, 199, ${mote.alpha * energy})`;
                ctx.beginPath(); ctx.arc(x, y, mote.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function drawOrb(now) {
            const t = (now - startTime) / 1000;
            const reveal = igniteAt ? Math.min(1, (now - igniteAt) / 850) : 0;
            const energy = 0.35 + 0.65 * reveal;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEarthGlow(energy); drawStoneRings(energy, t); drawShards(energy, t); drawCore(energy, t); drawMotes(energy, t);
            requestAnimationFrame(drawOrb);
        }

        const clubsGrid = document.getElementById('clubs-grid');
        const eventData = new Map();

        function renderClub(club) {
            const card = document.createElement('div');
            card.className = 'club-card';
            card.innerHTML = `
                <div class="club-logo"><img src="${club.logo}" alt="${club.name}"></div>
                <div class="club-info"><div class="club-name">${club.name}</div></div>
                <div class="club-events-pop">
                    <div class="pop-title">Events</div>
                    ${club.events.map(event => `<div class="ev-item" data-event-name="${event.name}">${event.name}</div>`).join('')}
                </div>
            `;
            return card;
        }

        async function loadClubData() {
            const response = await fetch('/earth/clubs.json');
            if (!response.ok) throw new Error('Failed to load club data');
            const data = await response.json();
            clubsGrid.innerHTML = '';
            data.clubs.forEach(club => {
                club.events.forEach(event => eventData.set(event.name, event));
                clubsGrid.appendChild(renderClub(club));
            });
            bindClubInteractions();
        }

        const modal = document.getElementById('ev-modal'), closeModal = document.getElementById('modal-close');
        function openEventDetail(name) {
            const data = eventData.get(name); if (!data) return;
            document.getElementById('m-title').textContent = name;
            document.getElementById('m-date').textContent = data.date;
            document.getElementById('m-loc').textContent = data.location;
            document.getElementById('m-prize').textContent = data.prize;
            document.getElementById('m-contact').textContent = data.contact;
            document.getElementById('m-desc').textContent = data.description;
            document.getElementById('m-link').href = data.link;
            modal.classList.add('open');
        }
        closeModal.onclick = () => modal.classList.remove('open');
        window.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };

        function bindClubInteractions() {
            document.querySelectorAll('.ev-item').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    openEventDetail(btn.dataset.eventName || btn.textContent.trim());
                };
            });
            document.querySelectorAll('.club-logo').forEach(logo => {
                logo.onclick = (e) => {
                    e.stopPropagation();
                    const card = logo.closest('.club-card');
                    const shouldOpen = !card.classList.contains('active');
                    document.querySelectorAll('.club-card.active').forEach(active => active.classList.remove('active'));
                    if (shouldOpen) card.classList.add('active');
                };
            });
        }
        document.addEventListener('click', () => {
            document.querySelectorAll('.club-card.active').forEach(active => active.classList.remove('active'));
        });

        function startSequence() {
            document.body.classList.add('boot');
            setTimeout(() => { igniteAt = performance.now(); document.body.classList.add('orb-on'); requestAnimationFrame(drawOrb); }, 1050);
            setTimeout(() => document.body.classList.add('settled'), 2100);
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        loadClubData().catch((error) => {
            console.error(error);
            clubsGrid.innerHTML = '<p style="text-align:center;color:rgba(239,250,241,0.72);">Club data failed to load.</p>';
        });
        if (character.complete) startSequence(); else character.addEventListener('load', startSequence, { once: true });
    </script>
</body>
</html>
