<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Summon</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            background: #29362b;
            color: #eef5eb;
        }
        #left-col {
            position: relative;
            width: 100%;
            height: 100vh;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            contain: layout paint;
            will-change: width;
        }
        body.shifting #left-col { width: 42%; }
        #scene-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        #character {
            position: absolute;
            bottom: -100%;
            left: 50%;
            height: 88vh;
            width: auto;
            transform: translate3d(-50%, 0, 0);
            transition: bottom 1.5s cubic-bezier(0.25, 1, 0.5, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
            user-select: none;
            -webkit-user-drag: none;
            backface-visibility: hidden;
            will-change: left, bottom, transform;
        }
        body.boot #character { bottom: -58px; transform: translate3d(calc(-50% + 3vw), 0, 0); }
        body.shifting #character { left: 50%; transform: translate3d(calc(-50% + 6vw), 0, 0); }
        #magic-container {
            position: absolute;
            left: 50%;
            bottom: 25%;
            width: min(24vw, 180px);
            aspect-ratio: 1 / 1;
            transform: translate3d(-50%, 0, 0) scale(0.82);
            transform-origin: center;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            overflow: visible;
            transition: opacity 0.9s ease, transform 1.1s ease;
            will-change: left, bottom, transform, opacity;
            backface-visibility: hidden;
            filter: drop-shadow(0 0 18px rgba(210, 182, 102, 0.30)) drop-shadow(0 0 42px rgba(121, 92, 38, 0.22));
        }
        body.orb-on #magic-container { opacity: 1; transform: translate3d(-50%, 0, 0) scale(1); }
        body.orb-on:not(.settled) #magic-container { left: 54.9%; bottom: 19.3%; }
        body.shifting #magic-container { left: 50%; bottom: 18.9%; transform: translate3d(calc(-50% + 8.1vw), 0, 0) scale(1); }
        #orb-canvas {
            position: absolute;
            inset: -32%;
            width: 164%;
            height: 164%;
            display: block;
        }
        #right-col {
            width: 58%;
            min-width: 0;
            height: 100vh;
            min-height: 0;
            padding: 28px 34px 64px 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            opacity: 0;
            transform: translateX(48px);
            transition: opacity 0.85s ease, transform 0.95s ease;
            border-left: 1px solid rgba(123, 205, 143, 0.24);
            background: transparent;
            overflow: hidden;
            contain: layout paint;
            will-change: transform, opacity;
        }
        #right-col::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 96px;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(41, 54, 43, 0) 0%, rgba(41, 54, 43, 0.82) 58%, #29362b 100%);
        }
        body.settled #right-col { opacity: 1; transform: translateX(0); }
        #right-col::-webkit-scrollbar { width: 6px; }
        #right-col::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        #right-col::-webkit-scrollbar-thumb { background: rgba(123, 205, 143, 0.3); border-radius: 10px; }
        #right-col::-webkit-scrollbar-thumb:hover { background: rgba(123, 205, 143, 0.5); }
        
        .ev-marker { font-size: clamp(8px, 1vw, 10px); letter-spacing: 5px; color: #d5f3da; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.32); text-transform: uppercase; margin-bottom: 8px; text-align: center; }
        .ev-title { font-size: clamp(22px, 3.5vw, 38px); font-weight: 800; line-height: 1.1; margin-bottom: 10px; color: #f4fff5; text-shadow: 0 6px 20px rgba(0, 0, 0, 0.22); text-align: center; }
        .ev-div { width: 36px; height: 1px; background: linear-gradient(90deg, transparent, #80d89b, transparent); margin: 0 auto 18px; }
        .ev-copy { max-width: 560px; color: rgba(239, 250, 241, 0.9); line-height: 1.62; margin: 0 auto 22px; text-align: center; }
        .sticky-head { position: relative; z-index: 6; padding: 4px 0 18px; margin-bottom: 6px; background: transparent; backdrop-filter: none; }
        .content-shell { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
        .scroll-body { width: 100%; flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; scrollbar-width: none; -ms-overflow-style: none; }
        .scroll-body::-webkit-scrollbar { display: none; }
        
        .clubs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
            gap: 28px 20px;
            max-width: 760px;
            margin: 0 auto 28px;
            justify-content: center;
        }
        
        .club-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            padding: 0;
            overflow: visible;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.35s ease, filter 0.35s ease;
        }
        .club-card:hover { transform: translateY(-4px); }
        .clubs-grid.focus-mode .club-card:not(.active) {
            filter: blur(8px) saturate(0.7);
            opacity: 0.2;
            transform: scale(0.94);
            pointer-events: none;
        }
        .club-card.active {
            z-index: 30;
            transform: translateY(-22px) scale(1.06);
        }
        .club-logo {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 35% 30%, rgba(161, 240, 178, 0.16), rgba(18, 31, 22, 0.88));
            border: 1px solid rgba(123, 205, 143, 0.24);
            border-radius: 999px;
            padding: 14px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.34);
            cursor: pointer;
            transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
            appearance: none;
            -webkit-appearance: none;
            margin: 0;
            font: inherit;
            color: inherit;
        }
        .club-card:hover .club-logo,
        .club-card.active .club-logo {
            transform: scale(1.1);
            border-color: rgba(168, 244, 186, 0.62);
            box-shadow: 0 22px 40px rgba(0, 0, 0, 0.5), 0 0 26px rgba(123, 205, 143, 0.24);
        }
        .club-logo img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5)); }
        .club-info { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .club-type { display: none; }
        .club-name { color: #f4fff5; font-size: 14px; font-weight: 700; line-height: 1.35; max-width: 140px; }
        .club-events-pop {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(320px, calc(100vw - 48px));
            max-height: min(78vh, 560px);
            padding: 18px 18px 16px;
            background: linear-gradient(180deg, rgba(11, 22, 14, 0.98), rgba(8, 18, 11, 0.96));
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            gap: 12px;
            overflow-y: auto;
            opacity: 0;
            transform: translate(-50%, calc(-50% + 14px)) scale(0.96);
            transition: opacity 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(123, 205, 143, 0.24);
            border-radius: 22px;
            box-shadow: 0 28px 56px rgba(0, 0, 0, 0.56);
            pointer-events: none;
            z-index: 32;
        }
        .club-events-pop.open {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
            border-color: rgba(150, 232, 170, 0.34);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 28px rgba(123, 205, 143, 0.12);
        }
        .club-events-pop { scrollbar-width: none; -ms-overflow-style: none; }
        .club-events-pop::-webkit-scrollbar { display: none; }
        .club-pop-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: 1px solid rgba(123, 205, 143, 0.2);
            background: rgba(255, 255, 255, 0.02);
            color: #c8f3d3;
            font: inherit;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        .club-pop-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-top: 6px;
        }
        .club-pop-logo {
            width: 72px;
            height: 72px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: radial-gradient(circle at 35% 30%, rgba(161, 240, 178, 0.18), rgba(18, 31, 22, 0.9));
            border: 1px solid rgba(123, 205, 143, 0.28);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.38);
        }
        .club-pop-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .pop-title { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #8edaa4; margin-bottom: 2px; text-align: center; }
        .club-pop-name { color: #f4fff5; font-size: 18px; font-weight: 700; line-height: 1.2; text-align: center; }
        .club-pop-list { display: flex; flex-direction: column; gap: 10px; }
        .ev-item {
            font-size: 13px; font-weight: 700; color: #f4fff6; background: rgba(123, 205, 143, 0.12);
            padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(123, 205, 143, 0.2);
            width: 100%; transition: all 0.3s ease; text-align: center; cursor: pointer;
        }
        .ev-item:hover { background: rgba(123, 205, 143, 0.2); transform: translateY(-1px); }
        body.club-focus #left-col,
        body.club-focus .sticky-head {
            filter: blur(10px) saturate(0.76);
            opacity: 0.5;
            transition: filter 0.35s ease, opacity 0.35s ease;
        }
        body.club-focus { overflow: hidden; }
        .club-focus-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 10, 6, 0.16);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 18;
        }
        body.club-focus .club-focus-overlay {
            opacity: 1;
            pointer-events: auto;
        }
        #club-popup-root {
            position: fixed;
            inset: 0;
            z-index: 40;
            pointer-events: none;
        }

        #ev-modal {
            position: fixed; inset: 0; z-index: 1000; background: rgba(10, 7, 3, 0.85);
            backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease; padding: 20px;
        }
        #ev-modal.open { opacity: 1; pointer-events: auto; }
        .modal-content {
            width: 100%; max-width: 500px; background: linear-gradient(135deg, #1c140b 0%, #0f0b06 100%);
            border: 1px solid rgba(194, 161, 74, 0.3); border-radius: 24px; padding: 40px 32px;
            position: relative; transform: scale(0.9) translateY(20px); transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(194, 161, 74, 0.1);
        }
        #ev-modal.open .modal-content { transform: scale(1) translateY(0); }
        .modal-close { position: absolute; top: 24px; right: 24px; width: 32px; height: 32px; cursor: pointer; color: rgba(224, 198, 128, 0.6); transition: color 0.3s ease; }
        .modal-close:hover { color: #e2c56a; }
        .modal-marker { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: rgba(224, 198, 128, 0.5); margin-bottom: 8px; }
        .modal-title { font-size: 28px; font-weight: 800; color: #f5ead7; margin-bottom: 24px; line-height: 1.2; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
        .modal-field label { display: block; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(224, 198, 128, 0.5); margin-bottom: 6px; }
        .modal-field div { font-size: 14px; font-weight: 600; color: #fff; }
        .reg-btn {
            display: block; width: 100%; padding: 16px; background: linear-gradient(180deg, #e2c56a 0%, #c2a14a 100%);
            color: #1c140b; text-align: center; text-decoration: none; font-weight: 800; border-radius: 12px;
            font-size: 14px; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .ev-item,
        .club-pop-close,
        .reg-btn {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .reg-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(194, 161, 74, 0.3); }

        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; }
            #left-col, body.shifting #left-col, #right-col { width: 100%; }
            #left-col { min-height: 62vh; }
            #right-col { min-height: 38vh; padding: 24px 20px 28px; transform: translateY(28px); border-left: 0; border-top: 1px solid rgba(194, 161, 74, 0.18); }
            body.settled #right-col { transform: translateY(0); }
            .sticky-head { padding: 2px 0 16px; }
            body.shifting #character { left: 50%; }
            body.shifting #magic-container { left: 52%; }
            .clubs-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; }
        }
        @media (max-width: 420px) {
            .clubs-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px; }
            .club-logo { width: 82px; height: 82px; padding: 12px; }
            .club-name { font-size: 13px; max-width: 120px; }
            .club-events-pop { width: min(284px, calc(100vw - 36px)); }
        }
    </style>
</head>
<body>
    <div id="left-col">
        <div id="scene-container">
            <img id="character" src="/earth/character.webp" alt="Earth Character">
            <div id="magic-container"><canvas id="orb-canvas"></canvas></div>
        </div>
    </div>
    <div id="right-col">
        <div class="content-shell">
            <div class="sticky-head">
            <div class="ev-marker">South - Prithvi District</div>
            <h1 class="ev-title">CLUB EVENTS</h1>
            <div class="ev-div"></div>
            <p class="ev-copy">The Prithvi district gathers the clubs that give the fest its weight and character. Each circle anchors a different discipline, from code and robotics to culture, design, media, and community work.</p>
            </div>
            <div class="scroll-body">
            <div class="clubs-grid" id="clubs-grid"></div>
            </div>
        </div>
    </div>
    <div class="club-focus-overlay" id="club-focus-overlay"></div>
    <div id="club-popup-root"></div>

    <div id="ev-modal">
        <div class="modal-content">
            <div class="modal-close" id="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" /></svg></div>
            <div class="modal-marker">Event Detail</div>
            <h2 class="modal-title" id="m-title">Event Name</h2>
            <div class="modal-grid">
                <div class="modal-field"><label>Date / Time</label><div id="m-date">-</div></div>
                <div class="modal-field"><label>Location</label><div id="m-loc">-</div></div>
                <div class="modal-field"><label>Prize Pool</label><div id="m-prize">-</div></div>
                <div class="modal-field"><label>Contact</label><div id="m-contact">-</div></div>
            </div>
            <div class="modal-field" style="margin-bottom: 24px;"><label>Description</label><div id="m-desc">-</div></div>
            <a href="#" class="reg-btn" id="m-link" target="_blank">Register Now</a>
        </div>
    </div>

    <script src="/earth/index.js"></script>
</body>
</html>
