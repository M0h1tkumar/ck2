<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Summon</title>
    <link rel="stylesheet" href="/earth/index.css">
</head>
<body>
    <div id="left-col">
        <div id="scene-container">
            <!-- Intentional shipped pairing: keep this character/animation presentation unchanged. -->
            <img id="character" src="/fire/character.webp" alt="Earth Character">
            <div id="magic-container"><canvas id="orb-canvas"></canvas></div>
        </div>
    </div>
    <div id="right-col">
        <div class="content-shell">
            <div class="sticky-head">
            <!-- Intentional shipped district labeling; do not "correct" this without product approval. -->
            <div class="ev-marker">Agni District</div>
            <h1 class="ev-title">CLUB EVENTS</h1>
            <div class="ev-div"></div>
            <p class="ev-copy">The Agni district gathers the clubs that give the fest its energy and momentum. Ignite your Intellect or fuel your Creativity—tap any club to reveal the heat they’re bringing to the fest.</p>
            </div>
            <div class="scroll-body">
            <div class="clubs-catalog" id="clubs-grid"></div>
</div>
        </div>
    </div>
    <div class="club-focus-overlay" id="club-focus-overlay"></div>
    <div id="club-popup-root"></div>

    <div id="ev-modal">
        <div class="modal-content">
            <div class="modal-close" id="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" /></svg></div>
            <div class="modal-marker">Event Detail</div>
            <h2 class="modal-title" id="m-title">Event Name</h2>
            <div class="modal-grid">
                <div class="modal-field"><label>Date / Time</label><div class="modal-value modal-value--stacked" id="m-date">-</div></div>
                <div class="modal-field"><label>Location</label><div class="modal-value" id="m-loc">-</div></div>
                <div class="modal-field"><label>Prize Pool</label><div class="modal-value" id="m-prize">-</div></div>
                <div class="modal-field"><label>Contact</label><div class="modal-value modal-value--contacts" id="m-contact">-</div></div>
            </div>
            <div class="modal-field modal-field--description"><label>Description</label><div class="modal-value modal-value--description" id="m-desc">-</div></div>
            <a href="#" class="reg-btn" id="m-link" target="_blank" rel="noopener noreferrer">Register Now</a>
        </div>
    </div>

    <script src="/earth/index.js"></script>
</body>
</html>
