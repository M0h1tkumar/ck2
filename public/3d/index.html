<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anant Tattva - Chakravyuh &amp; Genesis 2K26</title>
<link rel="stylesheet" href="/3d/index.css">
</head>
<body>

<div id="loader">
  <div id="audio-prompt" aria-live="polite" aria-hidden="true">
    <div class="audio-prompt__title">Choose your entrance audio</div>
    <div class="audio-prompt__copy">Select one option to begin the website. The entry sequence will wait here until you choose.</div>
    <div class="audio-prompt__actions">
      <button id="audio-prompt-enable" type="button">Play music</button>
      <button id="audio-prompt-skip" type="button">Continue silent</button>
    </div>
  </div>
  <button
    id="music-toggle"
    type="button"
    aria-label="Play entrance music"
    aria-pressed="false"
    title="Toggle entrance music"
    hidden
  >
    <span class="music-toggle__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 15.5V8.5H9L14 4V20L9 15.5H5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M18 9C19.333 10.167 20 11.5 20 13C20 14.5 19.333 15.833 18 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </span>
  </button>
  <video
    id="loader-video"
    muted
    playsinline
    preload="metadata"
    aria-label="Anant Tattva entry video"
    data-desktop-src="/entry/ENTRY.webm"
    data-mobile-src="/entry/ENTRY-mobile.webm"
  ></video>
  <audio id="loader-audio" preload="auto" loop>
    <source src="/music/aari.mpeg" type="audio/mpeg">
  </audio>
</div>
<script>
  (function () {
    const loaderVideo = document.getElementById('loader-video');
    if (!loaderVideo) return;
    const isPortraitMobile = window.matchMedia('(max-width: 900px) and (orientation: portrait)').matches;
    const targetSrc = isPortraitMobile ? loaderVideo.dataset.mobileSrc : loaderVideo.dataset.desktopSrc;
    if (targetSrc) {
      loaderVideo.setAttribute('src', targetSrc);
      loaderVideo.preload = 'auto';
      loaderVideo.load();
    }
  })();
</script>

<div id="center-btn">
  <button id="enter-btn"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="5" stroke="#E2C56A" stroke-width="1.2"/><circle cx="20" cy="20" r="13" stroke="#C2A14A" stroke-width=".7" stroke-dasharray="3 3"/><path d="M20 5v5M20 30v5M5 20h5M30 20h5" stroke="#E2C56A" stroke-width="1" stroke-linecap="round"/></svg></button>
  <div class="lbl">Tap to begin</div><div class="lbl-sub">Enter</div>
</div>

<div id="dir-nav">
  <button class="d-btn d-n" type="button" data-section="starnight" data-dir="north" aria-label="Open Star Night in Vayu district"><div class="d-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M7 10l5-5 5 5"/></svg></div><div class="d-lbl">Star Night</div><div class="d-tag">VAYU</div></button>
  <button class="d-btn d-v" type="button" data-section="events" data-dir="vayu" aria-label="Open Agenda in Prithvi district"><div class="d-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M7 10l5-5 5 5"/></svg></div><div class="d-lbl">Agenda</div><div class="d-tag">PRITHVI</div></button>
  <button class="d-btn d-e" type="button" data-section="clubs" data-dir="east" aria-label="Open Club Events in Agni district"><div class="d-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M7 10l5-5 5 5"/></svg></div><div class="d-lbl">Club Events</div><div class="d-tag">AGNI</div></button>
  <button class="d-btn d-w" type="button" data-section="register" data-dir="west" aria-label="Open Store in Jal district"><div class="d-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M7 10l5-5 5 5"/></svg></div><div class="d-lbl">Store</div><div class="d-tag">JAL</div></button>
  <button class="d-btn d-a" type="button" data-section="about" data-dir="south" aria-label="Open About in Akash Tattva"><div class="d-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M7 10l5-5 5 5"/></svg></div><div class="d-lbl">About</div><div class="d-tag">AKASH</div></button>
</div>

<div id="choice-prompt">
  <div class="title">Choose your<br>Tatva</div>
  <div class="sub">Select a direction <br>to continue</div>
</div>

<div id="back-btn"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg><span>Return</span></div>

<div class="cpanel" id="panel-starnight" style="padding:0;overflow:hidden"><iframe id="air-frame" src="" style="width:100%;height:100%;border:none;display:block" allow="fullscreen" title="Star Night - Vayu district"></iframe></div>

<div class="cpanel" id="panel-about" style="padding:0;overflow:hidden"><iframe id="sky-frame" src="" style="width:100%;height:100%;border:none;display:block" allow="fullscreen" title="About - Akash Tattva"></iframe></div>

<div class="cpanel" id="panel-events" style="padding:0;overflow:hidden"><iframe id="fire-frame" src="" style="width:100%;height:100%;border:none;display:block" allow="fullscreen" title="Agenda - Prithvi district"></iframe></div>

<div class="cpanel" id="panel-register" style="padding:0;overflow:hidden"><iframe id="water-frame" src="" style="width:100%;height:100%;border:none;display:block" allow="fullscreen" title="Store - Jal district"></iframe></div>

<div class="cpanel" id="panel-clubs" style="padding:0;overflow:hidden"><iframe id="earth-frame" src="" style="width:100%;height:100%;border:none;display:block" allow="fullscreen" title="Club events - Agni district"></iframe></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
<script type="module" src="/3d/index.js"></script>
</body>
</html>
