<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Summon</title>
    <link rel="stylesheet" href="/fire/mobile.css">
</head>
<body>
    <div id="left-col">
        <div id="scene-container">
            <!-- Intentional shipped pairing: keep this character/animation presentation unchanged. -->
            <img id="character" src="/earth/character.webp" alt="Character">
            <div id="magic-container">
                <canvas id="orb-canvas"></canvas>
            </div>
        </div>
    </div>

    <div id="right-col">
        <div class="content-shell">
        <div class="sticky-head">
        <!-- Intentional shipped district labeling; do not "correct" this without product approval. -->
        <div class="ev-marker">Prithvi District</div>
        <h1 class="ev-title">AGENDA</h1>
        <div class="ev-div"></div>
        <div class="ev-copy">Track the three-day pulse of Prithvi District, from competitive builds and live showcases to the final ascent beneath the evening lights.</div>
        </div>
        <div class="scroll-body">
        <div class="agenda-root" id="agenda-root">
            <div class="agenda-loading">Loading agenda from club data...</div>
        </div>
</div>
        </div>
    </div>

    <script src="/shared/mobile-viewport.js"></script>
    <script src="/fire/agenda.js"></script>
    <script src="/fire/mobile.js"></script>
</body>
</html>
