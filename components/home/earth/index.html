<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Summon</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 24%, rgba(194, 161, 74, 0.16), transparent 26%),
                radial-gradient(circle at 50% 74%, rgba(111, 86, 40, 0.12), transparent 34%),
                linear-gradient(180deg, #0f0b06 0%, #1c140b 42%, #090603 100%);
            color: #f4ead7;
        }

        #action-btn {
            position: absolute;
            top: 20px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 700;
            color: #f8f0df;
            background: linear-gradient(180deg, #d4b365 0%, #8f6a2f 100%);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 10px 28px rgba(143, 106, 47, 0.34);
            transition: transform .2s, opacity .3s;
        }

        #action-btn:active { transform: scale(0.96); }

        #scene-container {
            position: relative;
            width: min(100vw, 760px);
            height: 92vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #character {
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            height: 88vh;
            width: auto;
            transition: bottom 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
            user-select: none;
            -webkit-user-drag: none;
        }

        #character.rise { bottom: 0; }

        #magic-container {
            position: absolute;
            left: 56%;
            bottom: 23.5%;
            width: min(24vw, 180px);
            aspect-ratio: 1 / 1;
            transform: translateX(-50%) scale(0.82);
            transform-origin: center;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            overflow: visible;
            transition: opacity 0.9s ease, transform 1.1s ease;
            filter:
                drop-shadow(0 0 18px rgba(210, 182, 102, 0.30))
                drop-shadow(0 0 42px rgba(121, 92, 38, 0.24));
        }

        #magic-container.ignite {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        #orb-canvas {
            position: absolute;
            inset: -32%;
            width: 164%;
            height: 164%;
            display: block;
        }

        @media (max-width: 640px) {
            #scene-container {
                width: 100vw;
                height: 88vh;
            }

            #magic-container {
                left: 56%;
                bottom: 25%;
                width: min(30vw, 150px);
            }
        }
    </style>
</head>
<body>
    <button id="action-btn">Summon Earth</button>
    <div id="scene-container">
        <img id="character" src="character.png" alt="Earth Character">
        <div id="magic-container">
            <canvas id="orb-canvas"></canvas>
        </div>
    </div>

    <script>
        const btn = document.getElementById('action-btn');
        const character = document.getElementById('character');
        const magicContainer = document.getElementById('magic-container');
        const canvas = document.getElementById('orb-canvas');
        const ctx = canvas.getContext('2d');

        let cx = 0;
        let cy = 0;
        let radius = 0;
        let startTime = performance.now();
        let igniteAt = 0;

        const ringCount = 4;
        const shardCount = 12;
        const moteCount = 40;

        const motes = Array.from({ length: moteCount }, () => ({
            angle: Math.random() * Math.PI * 2,
            distance: 0.38 + Math.random() * 0.56,
            size: 1.4 + Math.random() * 3.4,
            speed: 0.18 + Math.random() * 0.5,
            orbit: (Math.random() < 0.5 ? -1 : 1) * (0.14 + Math.random() * 0.32),
            alpha: 0.28 + Math.random() * 0.42,
            rise: 0.04 + Math.random() * 0.16
        }));

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            const cssWidth = rect.width || 1;
            const cssHeight = rect.height || 1;
            cx = cssWidth / 2;
            cy = cssHeight / 2;
            radius = Math.min(cssWidth, cssHeight) * 0.23;
        }

        function polarPoint(angle, dist, yScale = 1) {
            return {
                x: cx + Math.cos(angle) * dist,
                y: cy + Math.sin(angle) * dist * yScale
            };
        }

        function drawEarthGlow(energy) {
            const outer = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2.55);
            outer.addColorStop(0, `rgba(242, 224, 177, ${0.10 * energy})`);
            outer.addColorStop(0.24, `rgba(195, 161, 94, ${0.14 * energy})`);
            outer.addColorStop(0.55, `rgba(120, 88, 36, ${0.12 * energy})`);
            outer.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = outer;
            ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        }

        function drawCore(energy, t) {
            const pulse = Math.sin(t * 1.8) * 0.03;
            const coreR = radius * (0.79 + pulse);

            const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.6);
            aura.addColorStop(0, `rgba(250, 241, 214, ${0.90 * energy})`);
            aura.addColorStop(0.22, `rgba(214, 183, 112, ${0.78 * energy})`);
            aura.addColorStop(0.5, `rgba(143, 109, 56, ${0.42 * energy})`);
            aura.addColorStop(0.76, `rgba(76, 54, 21, ${0.16 * energy})`);
            aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 1.6, 0, Math.PI * 2);
            ctx.fill();

            const core = ctx.createRadialGradient(
                cx - radius * 0.08,
                cy - radius * 0.12,
                radius * 0.05,
                cx,
                cy,
                coreR
            );
            core.addColorStop(0, `rgba(255, 248, 232, ${0.96 * energy})`);
            core.addColorStop(0.18, `rgba(234, 213, 163, ${0.94 * energy})`);
            core.addColorStop(0.48, `rgba(173, 136, 74, ${0.82 * energy})`);
            core.addColorStop(0.76, `rgba(110, 78, 34, ${0.48 * energy})`);
            core.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = core;
            ctx.beginPath();
            ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(240, 222, 178, ${0.18 * energy})`;
            ctx.lineWidth = radius * 0.075;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.86, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawStoneRings(energy, t) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            for (let i = 0; i < ringCount; i++) {
                const phase = t * (0.8 + i * 0.12) + i * 1.4;
                const r = radius * (0.94 + i * 0.16 + Math.sin(phase) * 0.02);
                ctx.strokeStyle = `rgba(216, 188, 122, ${(0.14 - i * 0.02) * energy})`;
                ctx.lineWidth = Math.max(1, radius * (0.022 - i * 0.003));
                ctx.beginPath();
                ctx.ellipse(cx, cy, r, r * (0.86 + Math.sin(phase * 0.7) * 0.03), phase * 0.08, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawShards(energy, t) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';

            for (let i = 0; i < shardCount; i++) {
                const baseAngle = (i / shardCount) * Math.PI * 2 + t * (0.16 + (i % 3) * 0.05);
                const inner = polarPoint(baseAngle, radius * (0.40 + (i % 3) * 0.06), 0.92);
                const outer = polarPoint(baseAngle + 0.08, radius * (1.02 + (i % 4) * 0.06), 0.84);
                const tail = polarPoint(baseAngle + 0.16, radius * (0.68 + (i % 5) * 0.05), 0.96);

                const gradient = ctx.createLinearGradient(inner.x, inner.y, outer.x, outer.y);
                gradient.addColorStop(0, `rgba(244, 232, 197, ${0.10 * energy})`);
                gradient.addColorStop(0.44, `rgba(198, 163, 94, ${0.46 * energy})`);
                gradient.addColorStop(1, `rgba(96, 68, 28, ${0.08 * energy})`);

                ctx.strokeStyle = gradient;
                ctx.lineWidth = radius * (0.024 + (i % 2) * 0.006);
                ctx.beginPath();
                ctx.moveTo(inner.x, inner.y);
                ctx.quadraticCurveTo(outer.x, outer.y, tail.x, tail.y);
                ctx.stroke();

                ctx.strokeStyle = `rgba(255, 244, 214, ${0.08 * energy})`;
                ctx.lineWidth = Math.max(1, radius * 0.007);
                ctx.beginPath();
                ctx.moveTo(inner.x, inner.y);
                ctx.lineTo(outer.x, outer.y);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawMotes(energy, t) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            for (const mote of motes) {
                const ang = mote.angle + t * mote.orbit;
                const dist = radius * (1.02 + mote.distance + Math.sin(t * mote.speed * 3 + mote.angle) * 0.08);
                const x = cx + Math.cos(ang) * dist;
                const y = cy + Math.sin(ang) * dist * 0.84 - Math.abs(Math.sin(t * mote.speed * 2.2 + mote.angle)) * radius * mote.rise;
                const alpha = mote.alpha * (0.46 + 0.36 * Math.sin(t * mote.speed * 5 + mote.angle)) * energy;
                const r = mote.size * (0.76 + 0.22 * Math.sin(t * mote.speed * 4));

                const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3.1);
                glow.addColorStop(0, `rgba(248, 235, 199, ${alpha})`);
                glow.addColorStop(0.42, `rgba(201, 170, 104, ${alpha * 0.62})`);
                glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(x, y, r * 3.1, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawOrb(now) {
            const t = (now - startTime) / 1000;
            const reveal = igniteAt ? Math.min(1, (now - igniteAt) / 850) : 0;
            const energy = 0.35 + 0.65 * reveal;
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;

            ctx.clearRect(0, 0, w, h);
            drawEarthGlow(energy);
            drawStoneRings(energy, t);
            drawShards(energy, t);
            drawCore(energy, t);
            drawMotes(energy, t);

            requestAnimationFrame(drawOrb);
        }

        function igniteOrb() {
            igniteAt = performance.now();
            magicContainer.classList.add('ignite');
        }

        btn.addEventListener('click', () => {
            character.classList.add('rise');
            btn.style.opacity = '0';
            btn.style.pointerEvents = 'none';

            setTimeout(() => {
                btn.style.display = 'none';
                igniteOrb();
            }, 1200);
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        requestAnimationFrame(drawOrb);
    </script>
</body>
</html>
