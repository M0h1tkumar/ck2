<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Summon</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 24%, rgba(255, 129, 54, 0.13), transparent 26%),
                radial-gradient(circle at 50% 74%, rgba(255, 74, 22, 0.10), transparent 34%),
                linear-gradient(180deg, #190603 0%, #210907 42%, #090202 100%);
        }

        #action-btn {
            position: absolute;
            top: 20px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 700;
            color: #fff6ef;
            background: linear-gradient(180deg, #ff8b49 0%, #e04416 100%);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 10px 28px rgba(224, 68, 22, 0.34);
            transition: transform .2s, opacity .3s;
        }

        #action-btn:active { transform: scale(0.96); }

        #scene-container {
            position: relative;
            width: min(100vw, 760px);
            height: 92vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        #character {
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            height: 88vh;
            width: auto;
            transition: bottom 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
            user-select: none;
            -webkit-user-drag: none;
        }

        #character.rise { bottom: 0; }

        #magic-container {
            position: absolute;
            left: 56%;
            bottom: 23.5%;
            width: min(24vw, 180px);
            aspect-ratio: 1 / 1;
            transform: translateX(-50%) scale(0.82);
            transform-origin: center;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            overflow: visible;
            transition: opacity 0.9s ease, transform 1.1s ease;
            filter:
                drop-shadow(0 0 18px rgba(255, 146, 63, 0.32))
                drop-shadow(0 0 42px rgba(255, 71, 22, 0.22));
        }

        #magic-container.ignite {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        #orb-canvas {
            position: absolute;
            inset: -32%;
            width: 164%;
            height: 164%;
            display: block;
        }

        @media (max-width: 640px) {
            #scene-container {
                width: 100vw;
                height: 88vh;
            }

            #magic-container {
                left: 56%;
                bottom: 25%;
                width: min(30vw, 150px);
            }
        }
    </style>
</head>
<body>
    <button id="action-btn">Summon Fire</button>
    <div id="scene-container">
        <img id="character" src="character.png" alt="Character">
        <div id="magic-container">
            <canvas id="orb-canvas"></canvas>
        </div>
    </div>

    <script>
        const btn = document.getElementById('action-btn');
        const character = document.getElementById('character');
        const magicContainer = document.getElementById('magic-container');
        const canvas = document.getElementById('orb-canvas');
        const ctx = canvas.getContext('2d');

        let cx = 0;
        let cy = 0;
        let radius = 0;
        let startTime = performance.now();
        let igniteAt = 0;

        const flameCount = 18;
        const emberCount = 56;
        const fumeCount = 24;

        const embers = Array.from({ length: emberCount }, () => ({
            angle: Math.random() * Math.PI * 2,
            distance: 0.36 + Math.random() * 0.65,
            size: 1.2 + Math.random() * 3.6,
            speed: 0.45 + Math.random() * 1.0,
            orbit: (Math.random() < 0.5 ? -1 : 1) * (0.28 + Math.random() * 0.72),
            alpha: 0.45 + Math.random() * 0.45,
            lift: 0.4 + Math.random() * 0.9
        }));

        const fumes = Array.from({ length: fumeCount }, () => ({
            lane: -0.9 + Math.random() * 1.8,
            sideBias: Math.random() < 0.5 ? -1 : 1,
            start: Math.random(),
            size: 0.14 + Math.random() * 0.24,
            rise: 0.75 + Math.random() * 0.9,
            sway: 0.10 + Math.random() * 0.28,
            speed: 0.45 + Math.random() * 0.7,
            alpha: 0.08 + Math.random() * 0.12,
            heat: Math.random()
        }));

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            const cssWidth = rect.width || 1;
            const cssHeight = rect.height || 1;
            cx = cssWidth / 2;
            cy = cssHeight / 2;
            radius = Math.min(cssWidth, cssHeight) * 0.23;
        }

        function polarPoint(angle, dist, yScale = 1) {
            return {
                x: cx + Math.cos(angle) * dist,
                y: cy + Math.sin(angle) * dist * yScale
            };
        }

        function drawHeatGlow(energy) {
            const outer = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2.55);
            outer.addColorStop(0, `rgba(255, 205, 117, ${0.16 * energy})`);
            outer.addColorStop(0.26, `rgba(255, 118, 46, ${0.15 * energy})`);
            outer.addColorStop(0.55, `rgba(255, 49, 20, ${0.10 * energy})`);
            outer.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = outer;
            ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        }

        function drawCore(energy, t) {
            const coreR = radius * (0.78 + Math.sin(t * 3.2) * 0.03);

            const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.62);
            aura.addColorStop(0, `rgba(255, 250, 221, ${0.96 * energy})`);
            aura.addColorStop(0.18, `rgba(255, 203, 118, ${0.90 * energy})`);
            aura.addColorStop(0.44, `rgba(255, 111, 38, ${0.52 * energy})`);
            aura.addColorStop(0.72, `rgba(233, 44, 14, ${0.18 * energy})`);
            aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 1.62, 0, Math.PI * 2);
            ctx.fill();

            const core = ctx.createRadialGradient(
                cx - radius * 0.08,
                cy - radius * 0.12,
                radius * 0.05,
                cx,
                cy,
                coreR
            );
            core.addColorStop(0, `rgba(255, 255, 243, ${energy})`);
            core.addColorStop(0.16, `rgba(255, 239, 173, ${0.98 * energy})`);
            core.addColorStop(0.40, `rgba(255, 169, 62, ${0.90 * energy})`);
            core.addColorStop(0.70, `rgba(255, 72, 20, ${0.48 * energy})`);
            core.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = core;
            ctx.beginPath();
            ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(255, 220, 150, ${0.20 * energy})`;
            ctx.lineWidth = radius * 0.07;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.84, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawFumes(energy, t) {
            ctx.save();
            ctx.globalCompositeOperation = 'screen';

            for (let i = 0; i < fumeCount; i++) {
                const fume = fumes[i];
                const life = (fume.start + t * fume.speed * 0.34) % 1;
                const baseX = cx + fume.lane * radius * 0.95 + fume.sideBias * radius * 0.14;
                const x = baseX + Math.sin(t * (1.4 + fume.sway) + i * 1.7) * radius * fume.sway * life;
                const y = cy + radius * 0.55 - life * radius * (1.8 + fume.rise) + Math.cos(t * 1.2 + i) * radius * 0.04;
                const puffR = radius * (fume.size + life * 0.18);
                const alpha = Math.sin(life * Math.PI) * fume.alpha * energy;

                const puff = ctx.createRadialGradient(x, y, 0, x, y, puffR * 2.9);
                puff.addColorStop(0, `rgba(255, ${150 + Math.round(fume.heat * 60)}, 88, ${alpha})`);
                puff.addColorStop(0.28, `rgba(175, 70, 36, ${alpha * 0.58})`);
                puff.addColorStop(0.62, `rgba(72, 28, 22, ${alpha * 0.34})`);
                puff.addColorStop(0.86, `rgba(28, 12, 12, ${alpha * 0.18})`);
                puff.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = puff;
                ctx.beginPath();
                ctx.ellipse(
                    x,
                    y,
                    puffR * (0.9 + life * 0.55),
                    puffR * (1.15 + life * 0.95),
                    Math.sin(t * 0.7 + i) * 0.18,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            ctx.restore();
        }

        function drawFlameTongues(energy, t) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';

            for (let i = 0; i < flameCount; i++) {
                const baseAngle = (i / flameCount) * Math.PI * 2 + t * (0.5 + (i % 3) * 0.12);
                const outward = radius * (1.02 + (i % 4) * 0.08);
                const curl = Math.sin(t * (2.8 + i * 0.11) + i * 0.7) * radius * 0.22;
                const p1 = polarPoint(baseAngle, radius * (0.34 + (i % 3) * 0.06), 0.92);
                const p2 = polarPoint(baseAngle + 0.26, outward + curl, 0.84);
                const p3 = polarPoint(baseAngle + 0.56, radius * (0.70 + (i % 5) * 0.06), 0.96);

                const gradient = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
                gradient.addColorStop(0, `rgba(255, 233, 170, ${0.16 * energy})`);
                gradient.addColorStop(0.4, `rgba(255, 137, 48, ${0.58 * energy})`);
                gradient.addColorStop(1, `rgba(239, 44, 14, ${0.08 * energy})`);

                ctx.strokeStyle = gradient;
                ctx.lineWidth = radius * (0.022 + (i % 3) * 0.008);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.quadraticCurveTo(p2.x, p2.y, p3.x, p3.y);
                ctx.stroke();

                ctx.strokeStyle = `rgba(255, 248, 223, ${0.10 * energy})`;
                ctx.lineWidth = Math.max(1, radius * 0.007);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.quadraticCurveTo(
                    (p1.x + p2.x) / 2,
                    (p1.y + p2.y) / 2 - radius * 0.04,
                    p3.x,
                    p3.y
                );
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawEmbers(energy, t) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            for (const ember of embers) {
                const ang = ember.angle + t * ember.orbit;
                const dist = radius * (1.10 + ember.distance + Math.sin(t * ember.speed * 3.4 + ember.angle) * 0.08);
                const x = cx + Math.cos(ang) * dist;
                const y = cy + Math.sin(ang) * dist * 0.86 - Math.abs(Math.sin(t * ember.lift + ember.angle)) * radius * 0.22;
                const alpha = ember.alpha * (0.45 + 0.55 * Math.sin(t * ember.speed * 6 + ember.angle)) * energy;
                const r = ember.size * (0.74 + 0.34 * Math.sin(t * ember.speed * 4.5));

                const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3.4);
                glow.addColorStop(0, `rgba(255, 245, 208, ${alpha})`);
                glow.addColorStop(0.40, `rgba(255, 164, 72, ${alpha * 0.7})`);
                glow.addColorStop(0.72, `rgba(255, 76, 22, ${alpha * 0.32})`);
                glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(x, y, r * 3.4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawOrb(now) {
            const t = (now - startTime) / 1000;
            const reveal = igniteAt ? Math.min(1, (now - igniteAt) / 850) : 0;
            const energy = 0.35 + 0.65 * reveal;
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;

            ctx.clearRect(0, 0, w, h);
            drawHeatGlow(energy);
            drawFumes(energy, t);
            drawFlameTongues(energy, t);
            drawCore(energy, t);
            drawEmbers(energy, t);

            requestAnimationFrame(drawOrb);
        }

        function igniteOrb() {
            igniteAt = performance.now();
            magicContainer.classList.add('ignite');
        }

        btn.addEventListener('click', () => {
            character.classList.add('rise');
            btn.style.opacity = '0';
            btn.style.pointerEvents = 'none';

            setTimeout(() => {
                btn.style.display = 'none';
                igniteOrb();
            }, 1200);
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        requestAnimationFrame(drawOrb);
    </script>
</body>
</html>
