<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Summon</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            background:
                radial-gradient(circle at 28% 42%, rgba(74, 182, 255, 0.20), transparent 22%),
                radial-gradient(circle at 72% 52%, rgba(0, 154, 255, 0.12), transparent 28%),
                linear-gradient(180deg, #03101d 0%, #041827 42%, #02070f 100%);
            color: #edf9ff;
        }

        #left-col {
            position: relative;
            width: 100%;
            height: 100vh;
            flex-shrink: 0;
            transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
        }

        body.settled #left-col {
            width: 38%;
        }

        #scene-container {
            position: absolute;
            inset: 0;
        }

        #character {
            position: absolute;
            bottom: -100%;
            left: 50%;
            height: 88vh;
            width: auto;
            transform: translateX(-50%);
            z-index: 1;
            user-select: none;
            -webkit-user-drag: none;
            transition:
                bottom 1.25s cubic-bezier(0.25, 1, 0.5, 1),
                left 1.2s cubic-bezier(0.22, 1, 0.36, 1),
                transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.boot #character {
            bottom: 0;
        }

        body.settled #character {
            left: 66%;
            transform: translateX(-50%) scale(0.98);
        }

        #magic-container {
            position: absolute;
            left: 50%;
            bottom: 23.5%;
            width: min(22vw, 170px);
            aspect-ratio: 1 / 1;
            transform: translateX(-50%) scale(0.82);
            transform-origin: center;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            overflow: visible;
            transition:
                opacity 0.9s ease,
                transform 1.1s ease,
                left 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            filter:
                drop-shadow(0 0 18px rgba(86, 217, 255, 0.30))
                drop-shadow(0 0 42px rgba(18, 132, 255, 0.20));
        }

        body.orb-on #magic-container {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        body.orb-on:not(.settled) #magic-container {
            left: 51.8%;
            bottom: 23.9%;
        }

        body.settled #magic-container {
            left: 69%;
        }

        #orb-canvas {
            position: absolute;
            inset: -32%;
            width: 164%;
            height: 164%;
            display: block;
        }

        #right-col {
            width: 60%;
            min-width: 0;
            height: 100vh;
            padding: 56px 44px 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transform: translateX(48px);
            transition: opacity 0.8s ease, transform 0.9s ease;
            border-left: 1px solid rgba(125, 208, 255, 0.12);
        }

        body.settled #right-col {
            opacity: 1;
            transform: translateX(0);
        }

        #right-col::-webkit-scrollbar { width: 4px; }
        #right-col::-webkit-scrollbar-thumb { background: rgba(125, 208, 255, 0.25); border-radius: 4px; }

        .ev-marker {
            font-size: clamp(8px, 1vw, 10px);
            letter-spacing: 5px;
            color: rgba(125, 208, 255, 0.58);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .ev-title {
            font-size: clamp(22px, 3.5vw, 38px);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 14px;
            color: #d7f4ff;
        }

        .ev-div {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, #7dd0ff, transparent);
            margin-bottom: 24px;
        }

        .ev-copy {
            max-width: 560px;
            color: rgba(222, 243, 255, 0.78);
            line-height: 1.65;
            margin-bottom: 24px;
        }

        .f-row {
            margin-bottom: 14px;
            max-width: 420px;
        }

        .f-row label {
            display: block;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(125, 208, 255, 0.64);
            margin-bottom: 6px;
        }

        .f-row input,
        .f-row select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(125, 208, 255, 0.05);
            border: 1px solid rgba(125, 208, 255, 0.20);
            border-radius: 10px;
            color: #e8f8ff;
            outline: none;
        }

        .f-row input::placeholder {
            color: rgba(232, 248, 255, 0.38);
        }

        .f-row select option {
            background: #072033;
        }

        .f-btn {
            margin-top: 10px;
            padding: 12px 22px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(180deg, #53d4ff 0%, #178fe7 100%);
            color: #edf9ff;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(23, 143, 231, 0.26);
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
                overflow-y: auto;
            }

            #left-col,
            body.settled #left-col,
            #right-col {
                width: 100%;
            }

            #left-col {
                min-height: 62vh;
            }

            #right-col {
                min-height: 38vh;
                padding: 24px 20px 28px;
                transform: translateY(28px);
                border-left: 0;
                border-top: 1px solid rgba(125, 208, 255, 0.12);
            }

            body.settled #right-col {
                transform: translateY(0);
            }

            body.settled #character {
                left: 50%;
            }

            body.settled #magic-container {
                left: 52%;
            }
        }
    </style>
</head>
<body>
    <div id="left-col">
        <div id="scene-container">
            <img id="character" src="/water/character.png" alt="Character">
            <div id="magic-container">
                <canvas id="orb-canvas"></canvas>
            </div>
        </div>
    </div>

    <div id="right-col">
        <div class="ev-marker">West — Jala District</div>
        <h1 class="ev-title">Register</h1>
        <div class="ev-div"></div>
        <p class="ev-copy">Step into the Jala district and reserve your place in the formation. The water channel keeps the experience calm and focused while the registration flow stays right beside the summoning sequence.</p>
        <div class="f-row"><label>Full Name</label><input type="text" placeholder="Your name"></div>
        <div class="f-row"><label>Email</label><input type="email" placeholder="you@college.edu"></div>
        <div class="f-row"><label>College</label><input type="text" placeholder="SOA University"></div>
        <div class="f-row"><label>Event</label><select><option value="">Choose...</option><option>Code Vyuh</option><option>Yantra Yudh</option><option>Rang Mandal</option><option>Roop Chakra</option><option>Digital Kurukshetra</option><option>All Events</option></select></div>
        <div class="f-row"><label>Team</label><input type="text" placeholder="Optional"></div>
        <button class="f-btn">Register</button>
    </div>

    <script>
        const character = document.getElementById('character');
        const magicContainer = document.getElementById('magic-container');
        const canvas = document.getElementById('orb-canvas');
        const ctx = canvas.getContext('2d');

        let cx = 0;
        let cy = 0;
        let radius = 0;
        let startTime = performance.now();
        let igniteAt = 0;
        let loopStarted = false;
        const isLowPower = navigator.hardwareConcurrency <= 4 || /Android|iPhone|iPad/i.test(navigator.userAgent);

        const ringCount = isLowPower ? 3 : 4;
        const arcCount = isLowPower ? 10 : 14;
        const sparkCount = isLowPower ? 28 : 46;

        const sparks = Array.from({ length: sparkCount }, () => ({
            angle: Math.random() * Math.PI * 2,
            distance: 0.45 + Math.random() * 0.42,
            size: 1 + Math.random() * 3.2,
            speed: 0.2 + Math.random() * 0.8,
            orbit: (Math.random() < 0.5 ? -1 : 1) * (0.18 + Math.random() * 0.5),
            alpha: 0.35 + Math.random() * 0.55
        }));

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, isLowPower ? 1 : 1.5);
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            const cssWidth = rect.width || 1;
            const cssHeight = rect.height || 1;
            cx = cssWidth / 2;
            cy = cssHeight / 2;
            radius = Math.min(cssWidth, cssHeight) * 0.23;
        }

        function circlePoint(angle, dist) {
            return { x: cx + Math.cos(angle) * dist, y: cy + Math.sin(angle) * dist };
        }

        function drawBackgroundGlow(energy) {
            const outer = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2.45);
            outer.addColorStop(0, `rgba(155, 244, 255, ${0.18 * energy})`);
            outer.addColorStop(0.26, `rgba(75, 210, 255, ${0.15 * energy})`);
            outer.addColorStop(0.55, `rgba(24, 132, 255, ${0.08 * energy})`);
            outer.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = outer;
            ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        }

        function drawCore(energy, t) {
            const coreR = radius * (0.76 + Math.sin(t * 2.7) * 0.025);

            const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 1.55);
            aura.addColorStop(0, `rgba(223, 252, 255, ${0.92 * energy})`);
            aura.addColorStop(0.20, `rgba(151, 241, 255, ${0.88 * energy})`);
            aura.addColorStop(0.46, `rgba(46, 195, 255, ${0.46 * energy})`);
            aura.addColorStop(0.72, `rgba(14, 110, 255, ${0.14 * energy})`);
            aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = aura;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 1.55, 0, Math.PI * 2);
            ctx.fill();

            const core = ctx.createRadialGradient(cx - radius * 0.10, cy - radius * 0.14, radius * 0.06, cx, cy, coreR);
            core.addColorStop(0, `rgba(255, 255, 255, ${0.98 * energy})`);
            core.addColorStop(0.18, `rgba(223, 252, 255, ${0.96 * energy})`);
            core.addColorStop(0.48, `rgba(115, 232, 255, ${0.88 * energy})`);
            core.addColorStop(0.74, `rgba(18, 159, 255, ${0.42 * energy})`);
            core.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = core;
            ctx.beginPath();
            ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawRipples(energy, t) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < ringCount; i++) {
                const phase = t * (1.7 + i * 0.2) + i * 1.3;
                const r = radius * (0.92 + i * 0.18 + Math.sin(phase) * 0.028);
                ctx.strokeStyle = `rgba(117, 232, 255, ${(0.11 - i * 0.018) * energy})`;
                ctx.lineWidth = Math.max(1, radius * (0.018 - i * 0.002));
                ctx.beginPath();
                ctx.ellipse(cx, cy, r, r * (0.95 + Math.sin(phase * 0.9) * 0.04), phase * 0.10, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawArcs(energy, t) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';
            for (let i = 0; i < arcCount; i++) {
                const baseAngle = (i / arcCount) * Math.PI * 2 + t * (0.42 + (i % 3) * 0.14);
                const wobble = Math.sin(t * (2.35 + i * 0.09) + i * 0.9) * radius * 0.15;
                const inner = radius * (0.46 + (i % 4) * 0.06);
                const outer = radius * (1.04 + (i % 5) * 0.05);
                const p1 = circlePoint(baseAngle, inner);
                const p3 = circlePoint(baseAngle + 0.86, inner + wobble);
                const gradient = ctx.createLinearGradient(p1.x, p1.y, p3.x, p3.y);
                gradient.addColorStop(0, `rgba(182, 246, 255, ${0.10 * energy})`);
                gradient.addColorStop(0.45, `rgba(50, 208, 255, ${0.54 * energy})`);
                gradient.addColorStop(1, `rgba(7, 108, 255, ${0.06 * energy})`);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = radius * (0.018 + (i % 3) * 0.006);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.quadraticCurveTo(cx + Math.cos(baseAngle + 0.43) * outer, cy + Math.sin(baseAngle + 0.43) * outer, p3.x, p3.y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawSparks(energy, t) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (const spark of sparks) {
                const ang = spark.angle + t * spark.orbit;
                const dist = radius * (1.16 + spark.distance + Math.sin(t * spark.speed * 4 + spark.angle) * 0.10);
                const x = cx + Math.cos(ang) * dist;
                const y = cy + Math.sin(ang) * dist * 0.94;
                const alpha = spark.alpha * (0.48 + 0.42 * Math.sin(t * spark.speed * 7 + spark.angle)) * energy;
                const r = spark.size * (0.7 + 0.3 * Math.sin(t * spark.speed * 5));
                const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
                glow.addColorStop(0, `rgba(214, 252, 255, ${alpha})`);
                glow.addColorStop(0.45, `rgba(77, 216, 255, ${alpha * 0.55})`);
                glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(x, y, r * 3.2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawOrb(now) {
            const t = (now - startTime) / 1000;
            const reveal = igniteAt ? Math.min(1, (now - igniteAt) / 900) : 0;
            const energy = 0.35 + 0.65 * reveal;
            ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
            drawBackgroundGlow(energy);
            drawRipples(energy, t);
            drawArcs(energy, t);
            drawCore(energy, t);
            drawSparks(energy, t);
            requestAnimationFrame(drawOrb);
        }

        function startRenderLoop() {
            if (loopStarted) return;
            loopStarted = true;
            startTime = performance.now();
            requestAnimationFrame(drawOrb);
        }

        function startSequence() {
            document.body.classList.add('boot');

            setTimeout(() => {
                igniteAt = performance.now();
                document.body.classList.add('orb-on');
                startRenderLoop();
            }, 1100);

            setTimeout(() => document.body.classList.add('settled'), 2100);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        if (character.complete) {
            requestAnimationFrame(startSequence);
        } else {
            character.addEventListener('load', startSequence, { once: true });
        }
    </script>
</body>
</html>
